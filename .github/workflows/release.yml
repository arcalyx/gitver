name: Build and Release

on:
  push:
    branches:
      - master
      - nightly
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v prefix)'
        required: true
        default: '0.0.0'

jobs:
  check_commit:
    name: Check Commit Message
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check_message.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Check for prerelease keyword
        id: check_message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"#prerelease"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Prerelease build detected"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Standard build detected"
          fi

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    needs: check_commit
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: |
          bash ./scripts/test.sh

      - name: Run linter
        id: run_lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

      - name: Set job status
        id: status
        run: |
          # We continue with the build regardless of test/lint status
          echo "Build will continue"

  build:
    name: Build and Release
    needs: [test, check_commit]
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Setup version file
        run: |
          mkdir -p .gitver
          if [ ! -f .gitver/.version ]; then
            echo "1.0.0" > .gitver/.version
          fi

      - name: Get version from gitver
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # For CI environment, read version directly from file
            if [[ -f .gitver/.version ]]; then
              BASE_VERSION=$(cat .gitver/.version)
              echo "Found version file with version: $BASE_VERSION"
            else
              BASE_VERSION="1.0.0"
              echo "No version file found, using default: $BASE_VERSION"
            fi
            
            # For nightly builds, append date and commit hash
            if [[ "${{ github.ref }}" == "refs/heads/nightly" ]]; then
              COMMIT_HASH=$(git rev-parse --short HEAD)
              DATE=$(date +'%Y%m%d')
              VERSION="${BASE_VERSION}-nightly.${DATE}.${COMMIT_HASH}"
              echo "Created nightly version: $VERSION"
            # For prerelease builds, append prerelease identifier
            elif [[ "${{ needs.check_commit.outputs.is_prerelease }}" == "true" ]]; then
              COMMIT_HASH=$(git rev-parse --short HEAD)
              VERSION="${BASE_VERSION}-pre.${COMMIT_HASH}"
              echo "Created prerelease version: $VERSION"
            else
              VERSION="${BASE_VERSION}"
              echo "Using standard version: $VERSION"
            fi
          else
            VERSION=${{ github.event.inputs.version }}
            echo "Using manually specified version: $VERSION"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ env.VERSION }}
        run: |
          bash ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitver_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/gitver*
          retention-days: 7

  release:
    name: Create Release
    needs: [build, check_commit]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup version file
        run: |
          mkdir -p .gitver
          if [ ! -f .gitver/.version ]; then
            echo "1.0.0" > .gitver/.version
          fi

      - name: Get version from gitver
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # For CI environment, read version directly from file
            if [[ -f .gitver/.version ]]; then
              BASE_VERSION=$(cat .gitver/.version)
              echo "Found version file with version: $BASE_VERSION"
            else
              BASE_VERSION="1.0.0"
              echo "No version file found, using default: $BASE_VERSION"
            fi
            
            # For nightly builds, append date and commit hash
            if [[ "${{ github.ref }}" == "refs/heads/nightly" ]]; then
              COMMIT_HASH=$(git rev-parse --short HEAD)
              DATE=$(date +'%Y%m%d')
              VERSION="${BASE_VERSION}-nightly.${DATE}.${COMMIT_HASH}"
              RELEASE_TYPE="nightly"
              echo "Created nightly version: $VERSION"
            # For prerelease builds, append prerelease identifier
            elif [[ "${{ needs.check_commit.outputs.is_prerelease }}" == "true" ]]; then
              COMMIT_HASH=$(git rev-parse --short HEAD)
              VERSION="${BASE_VERSION}-pre.${COMMIT_HASH}"
              RELEASE_TYPE="prerelease"
              echo "Created prerelease version: $VERSION"
            else
              VERSION="${BASE_VERSION}"
              RELEASE_TYPE="stable"
              echo "Using standard version: $VERSION"
            fi
          else
            VERSION=${{ github.event.inputs.version }}
            RELEASE_TYPE="stable"
            echo "Using manually specified version: $VERSION"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_TYPE=${RELEASE_TYPE}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Move artifacts to dist
        run: |
          mkdir -p dist
          echo "Moving artifacts to dist directory"
          find artifacts -type f -name "*.zip" -o -name "*.tar.gz" | xargs -I{} cp {} dist/
          echo "Contents of dist directory:"
          ls -la dist/

      - name: Generate changelog
        id: changelog
        env:
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          VERSION: ${{ env.VERSION }}
        run: |
          bash ./scripts/release.sh
          
          echo 'changelog<<CHANGELOG_DELIMITER' >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo 'CHANGELOG_DELIMITER' >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.RELEASE_TYPE == 'nightly' && 'Nightly Build' || env.RELEASE_TYPE == 'prerelease' && 'Prerelease' || 'Release' }} v${{ env.VERSION }}
          tag_name: ${{ env.RELEASE_TYPE == 'nightly' && format('nightly-{0}', env.VERSION) || env.RELEASE_TYPE == 'prerelease' && format('pre-{0}', env.VERSION) || format('v{0}', env.VERSION) }}
          body: |
            ## Gitver v${{ env.VERSION }}
            ${{ env.RELEASE_TYPE == 'nightly' && '⚠️ This is a nightly build and may contain bugs or incomplete features. Use at your own risk.' || env.RELEASE_TYPE == 'prerelease' && '⚠️ This is a prerelease build and may contain bugs or incomplete features. Use at your own risk.' || '' }}
            
            ### Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ### Installation
            
            #### Using Go
            ```bash
            go install github.com/arcalyx/gitver@latest
            ```
            
            #### Binary Download
            Download the appropriate binary for your platform below.
          files: dist/*
          draft: false
          prerelease: ${{ env.RELEASE_TYPE != 'stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
