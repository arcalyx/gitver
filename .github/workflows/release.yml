name: Build and Release

on:
  push:
    branches:
      - master
      - nightly
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v prefix)'
        required: true
        default: '0.0.0'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Setup test environment
        run: |
          mkdir -p .gitver
          echo "1.2.3" > .gitver/.version
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          if [ ! -d .git ]; then
            git init
            git add .
            git commit -m "Initial commit for tests"
          fi

      - name: Run tests
        run: |
          go test -v ./... || {
            echo "Tests failed. Checking for specific issues..."
            go test -v -race ./... || true
            exit 1
          }

      - name: Run linter
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest

  build:
    name: Build and Release
    needs: test
    if: always() && (needs.test.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Setup version file
        run: |
          mkdir -p .gitver
          if [ ! -f .gitver/.version ]; then
            echo "1.0.0" > .gitver/.version
          fi

      - name: Get version from gitver
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            go build -o gitver
            if [[ -f .gitver/.version ]]; then
              BASE_VERSION=$(cat .gitver/.version)
            else
              BASE_VERSION="1.0.0"
            fi
            if [[ "${{ github.ref }}" == "refs/heads/nightly" ]]; then
              COMMIT_HASH=$(git rev-parse --short HEAD)
              DATE=$(date +'%Y%m%d')
              VERSION="${BASE_VERSION}-nightly.${DATE}.${COMMIT_HASH}"
            else
              VERSION="${BASE_VERSION}"
            fi
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT="gitver"
          if [ "$GOOS" = "windows" ]; then
            OUTPUT="gitver.exe"
          fi
          go build -ldflags "-X github.com/arcalyx/gitver/cmd.Version=${{ env.VERSION }}" -o "dist/${OUTPUT}"
          mkdir -p dist
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -r "gitver_${{ env.VERSION }}_${GOOS}_${GOARCH}.zip" "${OUTPUT}"
          else
            tar -czvf "gitver_${{ env.VERSION }}_${GOOS}_${GOARCH}.tar.gz" "${OUTPUT}"
          fi
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: gitver_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/gitver*
          retention-days: 7

  release:
    name: Create Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup version file
        run: |
          mkdir -p .gitver
          if [ ! -f .gitver/.version ]; then
            echo "1.0.0" > .gitver/.version
          fi

      - name: Get version from gitver
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ -f .gitver/.version ]]; then
              BASE_VERSION=$(cat .gitver/.version)
            else
              BASE_VERSION="1.0.0"
            fi
            if [[ "${{ github.ref }}" == "refs/heads/nightly" ]]; then
              COMMIT_HASH=$(git rev-parse --short HEAD)
              DATE=$(date +'%Y%m%d')
              VERSION="${BASE_VERSION}-nightly.${DATE}.${COMMIT_HASH}"
            else
              VERSION="${BASE_VERSION}"
            fi
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == "refs/heads/nightly" ]]; then
            echo "RELEASE_TYPE=nightly" >> $GITHUB_ENV
          else
            echo "RELEASE_TYPE=stable" >> $GITHUB_ENV
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Move artifacts to dist
        run: |
          mkdir -p dist
          find artifacts -type f -name "*.zip" -o -name "*.tar.gz" | xargs -I{} cp {} dist/

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ "${{ env.RELEASE_TYPE }}" == "nightly" ]]; then
            git log -n 20 --pretty=format:"* %s (%h)" > CHANGELOG.md
          elif [ -z "$LATEST_TAG" ]; then
            git log --pretty=format:"* %s (%h)" > CHANGELOG.md
          else
            git log ${LATEST_TAG}..HEAD --pretty=format:"* %s (%h)" > CHANGELOG.md
          fi
          if [ ! -s CHANGELOG.md ]; then
            echo "* No changes" > CHANGELOG.md
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.RELEASE_TYPE == 'nightly' && 'Nightly Build' || 'Release' }} v${{ env.VERSION }}
          tag_name: ${{ env.RELEASE_TYPE == 'nightly' && format('nightly-{0}', env.VERSION) || format('v{0}', env.VERSION) }}
          body: |
            ## Gitver v${{ env.VERSION }}
            ${{ env.RELEASE_TYPE == 'nightly' && '⚠️ This is a nightly build and may contain bugs or incomplete features. Use at your own risk.' || '' }}
            
            ### Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ### Installation
            
            #### Using Go
            ```bash
            go install github.com/arcalyx/gitver@latest
            ```
            
            #### Binary Download
            Download the appropriate binary for your platform below.
          files: dist/*
          draft: false
          prerelease: ${{ env.RELEASE_TYPE == 'nightly' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
